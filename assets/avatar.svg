<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="陈文杰的头像插画">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.5" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde3c8"/>
      <stop offset="1" stop-color="#f6cfa8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 背景装饰 -->
  <circle cx="152" cy="44" r="26" fill="#ffffff" opacity="0.55"/>
  <circle cx="40" cy="158" r="18" fill="#ffffff" opacity="0.45"/>
  <path d="M14 176c26-16 48-10 62 4" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- 身体 / 衣服 -->
  <path d="M100 118c-30 0-52 18-52 44v38h104v-38c0-26-22-44-52-44z" fill="url(#shirt)"/>
  <path d="M84 120c4 12 10 18 16 18s12-6 16-18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

  <!-- 脖子 -->
  <path d="M88 100h24v22c0 6-5 10-12 10s-12-4-12-10z" fill="#f3c7a0"/>

  <!-- 头 -->
  <ellipse cx="100" cy="76" rx="34" ry="36" fill="url(#face)"/>

  <!-- 头发 -->
  <path d="M66 72c0-22 14-34 34-34s34 12 34 34c0-10-10-14-20-16-8-1.6-14 2-20 2s-12-3.6-20-2c-10 2-18 6-18 16z" fill="#2b3142"/>
  <path d="M66 72c2-8 10-11 18-12" fill="none" stroke="#2b3142" stroke-width="6" stroke-linecap="round"/>

  <!-- 五官 -->
  <circle cx="87" cy="80" r="3.4" fill="#2b3142"/>
  <circle cx="113" cy="80" r="3.4" fill="#2b3142"/>
  <path d="M92 92c4 4 12 4 16 0" fill="none" stroke="#c97b52" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="76" cy="89" r="5.4" fill="#f7a8a8" opacity="0.55"/>
  <circle cx="124" cy="89" r="5.4" fill="#f7a8a8" opacity="0.55"/>

  <!-- 眼镜（程序员气质） -->
  <g fill="none" stroke="#2b3142" stroke-width="3" opacity="0.9">
    <rect x="77" y="72" width="19" height="15" rx="6"/>
    <rect x="104" y="72" width="19" height="15" rx="6"/>
    <path d="M96 78h8"/>
  </g>
</svg>
